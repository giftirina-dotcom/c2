<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #1a1a2e;
    }

    .calculator {
      width: 320px;
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .display {
      background: #0f3460;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .expression {
      color: #94a3b8;
      font-size: 14px;
      min-height: 20px;
      word-break: break-all;
    }

    .result {
      color: #e2e8f0;
      font-size: 36px;
      font-weight: 300;
      word-break: break-all;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 18px;
      font-size: 20px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.96);
    }

    .digit,
    .decimal {
      background: #1a1a2e;
      color: #e2e8f0;
    }

    .digit:hover,
    .decimal:hover {
      background: #252545;
    }

    .operator {
      background: #533483;
      color: #e2e8f0;
    }

    .operator:hover {
      background: #6b44a8;
    }

    .operator.active {
      background: #fff;
      color: #533483;
    }

    .function {
      background: #533483;
      color: #e2e8f0;
    }

    .function:hover {
      background: #6b44a8;
    }

    .clear {
      background: #e94560;
      color: #fff;
    }

    .clear:hover {
      background: #ff6b6b;
    }

    .equals {
      background: #0f3460;
      color: #4ade80;
      grid-column: span 2;
    }

    .equals:hover {
      background: #1a4a7a;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button type="button" class="clear" data-action="clear">C</button>
      <button type="button" class="function" data-action="toggle-sign">±</button>
      <button type="button" class="function" data-action="percent">%</button>
      <button type="button" class="operator" data-action="operator" data-value="/">÷</button>

      <button type="button" class="digit" data-action="digit" data-value="7">7</button>
      <button type="button" class="digit" data-action="digit" data-value="8">8</button>
      <button type="button" class="digit" data-action="digit" data-value="9">9</button>
      <button type="button" class="operator" data-action="operator" data-value="*">×</button>

      <button type="button" class="digit" data-action="digit" data-value="4">4</button>
      <button type="button" class="digit" data-action="digit" data-value="5">5</button>
      <button type="button" class="digit" data-action="digit" data-value="6">6</button>
      <button type="button" class="operator" data-action="operator" data-value="-">−</button>

      <button type="button" class="digit" data-action="digit" data-value="1">1</button>
      <button type="button" class="digit" data-action="digit" data-value="2">2</button>
      <button type="button" class="digit" data-action="digit" data-value="3">3</button>
      <button type="button" class="operator" data-action="operator" data-value="+">+</button>

      <button type="button" class="digit zero" data-action="digit" data-value="0">0</button>
      <button type="button" class="decimal" data-action="decimal">,</button>
      <button type="button" class="equals" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const expressionEl = document.getElementById('expression');
    const resultEl = document.getElementById('result');
    const keysEl = document.querySelector('.keys');

    let currentValue = '0';
    let storedValue = null;
    let operator = null;
    let shouldResetDisplay = false;

    const OPERATOR_SYMBOLS = {
      '+': '+',
      '-': '−',
      '*': '×',
      '/': '÷',
    };

    function formatDisplay(value) {
      const num = parseFloat(value);
      if (Number.isNaN(num)) return 'Ошибка';
      if (!Number.isFinite(num)) return 'Ошибка';

      const str = String(num);
      if (str.length > 12) {
        return num.toPrecision(8).replace(/\.?0+$/, '');
      }
      return str.replace('.', ',');
    }

    function updateDisplay() {
      resultEl.textContent = formatDisplay(currentValue);

      if (storedValue !== null && operator) {
        expressionEl.textContent =
          formatDisplay(storedValue) + ' ' + OPERATOR_SYMBOLS[operator];
      } else {
        expressionEl.textContent = '';
      }

      document.querySelectorAll('[data-action="operator"]').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.value === operator);
      });
    }

    function inputDigit(digit) {
      if (shouldResetDisplay) {
        currentValue = digit;
        shouldResetDisplay = false;
      } else if (currentValue === '0') {
        currentValue = digit;
      } else if (currentValue.replace('-', '').length < 12) {
        currentValue += digit;
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (shouldResetDisplay) {
        currentValue = '0';
        shouldResetDisplay = false;
      }
      if (!currentValue.includes('.')) {
        currentValue += '.';
      }
      updateDisplay();
    }

    function clear() {
      currentValue = '0';
      storedValue = null;
      operator = null;
      shouldResetDisplay = false;
      updateDisplay();
    }

    function toggleSign() {
      if (currentValue === '0') return;
      currentValue = currentValue.startsWith('-')
        ? currentValue.slice(1)
        : '-' + currentValue;
      updateDisplay();
    }

    function percent() {
      const num = parseFloat(currentValue) / 100;
      currentValue = String(num);
      updateDisplay();
    }

    function calculate(a, b, op) {
      const x = parseFloat(a);
      const y = parseFloat(b);

      switch (op) {
        case '+': return x + y;
        case '-': return x - y;
        case '*': return x * y;
        case '/':
          if (y === 0) return NaN;
          return x / y;
        default: return y;
      }
    }

    function chooseOperator(nextOp) {
      const current = parseFloat(currentValue);

      if (storedValue === null) {
        storedValue = currentValue;
      } else if (!shouldResetDisplay) {
        const result = calculate(storedValue, currentValue, operator);
        if (!Number.isFinite(result)) {
          currentValue = 'NaN';
          storedValue = null;
          operator = null;
          shouldResetDisplay = true;
          updateDisplay();
          return;
        }
        currentValue = String(result);
        storedValue = currentValue;
      }

      operator = nextOp;
      shouldResetDisplay = true;
      updateDisplay();
    }

    function equals() {
      if (operator === null || storedValue === null) return;

      const result = calculate(storedValue, currentValue, operator);

      expressionEl.textContent =
        formatDisplay(storedValue) + ' ' +
        OPERATOR_SYMBOLS[operator] + ' ' +
        formatDisplay(currentValue) + ' =';

      if (!Number.isFinite(result)) {
        currentValue = 'NaN';
      } else {
        currentValue = String(result);
      }

      storedValue = null;
      operator = null;
      shouldResetDisplay = true;
      updateDisplay();
    }

    keysEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      const action = btn.dataset.action;
      const value = btn.dataset.value;

      switch (action) {
        case 'digit':
          inputDigit(value);
          break;
        case 'decimal':
          inputDecimal();
          break;
        case 'operator':
          chooseOperator(value);
          break;
        case 'equals':
          equals();
          break;
        case 'clear':
          clear();
          break;
        case 'toggle-sign':
          toggleSign();
          break;
        case 'percent':
          percent();
          break;
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
      else if (e.key === '.' || e.key === ',') inputDecimal();
      else if (e.key === '+') chooseOperator('+');
      else if (e.key === '-') chooseOperator('-');
      else if (e.key === '*') chooseOperator('*');
      else if (e.key === '/') {
        e.preventDefault();
        chooseOperator('/');
      }
      else if (e.key === 'Enter' || e.key === '=') equals();
      else if (e.key === 'Escape') clear();
      else if (e.key === 'Backspace') {
        if (currentValue.length > 1) {
          currentValue = currentValue.slice(0, -1);
        } else {
          currentValue = '0';
        }
        updateDisplay();
      }
    });

    updateDisplay();
  </script>
</body>
</html>
